<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Motion Comic Studio Writer — a lightweight local Markdown editor for fiction writers. Native Markdown, Story Tree & Storyline, AI-friendly workflows, manuscripts stay on your Mac."
    />
    <meta property="og:title" content="Motion Comic Studio Writer" />
    <meta
      property="og:description"
      content="A lightweight local Markdown editor for fiction writers. No lock-in, Story Tree & Storyline, AI collaboration, privacy by default."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/MotionComic/brand/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+SC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Motion Comic Studio Writer</title>
    <script type="module" crossorigin src="/MotionComic/assets/main-CMn9wwYy.js"></script>
    <link rel="stylesheet" crossorigin href="/MotionComic/assets/main-XJ2ZdqO7.css">
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#top" data-i18n-aria="nav.home">
        <img src="/MotionComic/brand/logo.png" alt="" width="40" height="40" />
        <span class="brand-text">
          <span class="brand-name">Motion Comic Studio</span>
          <span class="brand-product">Writer</span>
        </span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#features" data-i18n="nav.features"></a>
        <a href="#formats" data-i18n="nav.formats"></a>
        <a href="#gallery" data-i18n="nav.gallery"></a>
        <a href="#download" data-i18n="nav.download"></a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en" class="lang-btn is-active">EN</button>
          <button type="button" data-lang="zh" class="lang-btn">中文</button>
        </div>
        <a class="btn btn-sm btn-primary" href="#download" data-i18n="nav.cta"></a>
      </div>
      <button class="menu-toggle" type="button" aria-expanded="false" data-i18n-aria="nav.menu">
        <span></span><span></span>
      </button>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <p class="brand-mark" data-i18n="hero.brand"></p>
          <h1 data-i18n="hero.title"></h1>
          <p class="hero-lead" data-i18n="hero.lead"></p>
          <div class="hero-cta">
            <a class="btn btn-primary" href="#download" data-i18n="hero.ctaPrimary"></a>
            <a class="btn btn-ghost" href="#features" data-i18n="hero.ctaSecondary"></a>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="false">
          <div class="hero-frame">
            <img
              class="hero-shot"
              data-shot="hero"
              src="/MotionComic/banners/en-1.png"
              alt=""
              width="1600"
              height="1000"
            />
          </div>
        </div>
      </section>

      <section id="features" class="section features">
        <div class="section-head">
          <h2 data-i18n="features.title"></h2>
          <p data-i18n="features.lead"></p>
        </div>
        <div class="feature-grid" id="feature-grid"></div>
      </section>

      <section id="formats" class="section formats">
        <div class="section-head">
          <h2 data-i18n="formats.title"></h2>
          <p data-i18n="formats.lead"></p>
        </div>
        <div class="format-row" id="format-row"></div>
      </section>

      <section id="gallery" class="section gallery">
        <div class="section-head">
          <h2 data-i18n="gallery.title"></h2>
          <p data-i18n="gallery.lead"></p>
        </div>
        <div class="gallery-stage">
          <button class="gallery-nav prev" type="button" data-i18n-aria="gallery.prev">‹</button>
          <figure class="gallery-frame">
            <img
              id="gallery-image"
              src="/MotionComic/banners/en-1.png"
              alt=""
              width="1600"
              height="1000"
            />
            <figcaption id="gallery-caption"></figcaption>
          </figure>
          <button class="gallery-nav next" type="button" data-i18n-aria="gallery.next">›</button>
        </div>
        <div class="gallery-dots" id="gallery-dots" role="tablist"></div>
      </section>

      <section id="download" class="section download">
        <div class="download-panel">
          <h2 data-i18n="download.title"></h2>
          <p data-i18n="download.lead"></p>
          <div class="download-actions">
            <a
              class="btn btn-primary"
              href="https://github.com"
              id="download-mac"
              data-i18n="download.mac"
              target="_blank"
              rel="noopener noreferrer"
            ></a>
            <a
              class="btn btn-ghost"
              href="https://github.com"
              id="download-source"
              data-i18n="download.source"
              target="_blank"
              rel="noopener noreferrer"
            ></a>
          </div>
          <p class="download-note" data-i18n="download.note"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-brand">
        <img src="/MotionComic/brand/logo.png" alt="" width="36" height="36" />
        <div>
          <strong>Motion Comic Studio Writer</strong>
        </div>
      </div>
      <div class="footer-links">
        <a href="./support.html" id="footer-support" data-i18n="footer.support"></a>
        <a href="./privacy-policy-en.html" id="footer-privacy" data-i18n="footer.privacy"></a>
        <p class="footer-copy" data-i18n="footer.copy"></p>
      </div>
    </footer>

  </body>
</html>
